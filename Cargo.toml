[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/TradeCloud/CloudNode"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# internal
cloudnode-core = { path = "crates/core" }
cloudnode-vault = { path = "crates/vault" }
cloudnode-keys = { path = "crates/keys" }
cloudnode-ssh = { path = "crates/ssh" }
cloudnode-term = { path = "crates/term" }
cloudnode-ui-slint = { path = "crates/ui-slint" }
cloudnode-ui-tui = { path = "crates/ui-tui" }

# foundation
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
# The user's home folder, for ~/.ssh (std::env::home_dir is unreliable on some systems).
dirs = "6"

# keys: OpenSSH key files and fingerprints (RustCrypto, pure Rust, Apache-2.0 OR MIT). Only the
# parsing features: "std" (files, comments, RSA) and "ecdsa" (ECDSA keys, through sec1); no
# signing or encryption backends until CloudNode generates or uses keys itself.
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ecdsa"] }

# ui
# Pinned to the 1.18 minor releases: the macOS title bar (crates/ui-slint/src/chrome.rs) uses Slint's
# unstable winit 0.30 API, which may change in any minor release. Check chrome.rs when moving on.
slint = { version = "~1.18", features = ["unstable-winit-030"] }
slint-build = "~1.18"
ratatui = "0.30"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
