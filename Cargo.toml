[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/TradeCloud/CloudNode"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# internal
cloudnode-core = { path = "crates/core" }
cloudnode-vault = { path = "crates/vault" }
cloudnode-ssh = { path = "crates/ssh" }
cloudnode-term = { path = "crates/term" }
cloudnode-ui-slint = { path = "crates/ui-slint" }
cloudnode-ui-tui = { path = "crates/ui-tui" }

# foundation
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# ui
slint = "1.18"
slint-build = "1.18"
ratatui = "0.30"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
